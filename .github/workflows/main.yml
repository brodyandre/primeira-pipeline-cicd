name: CI-CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  CI:
    name: Build e Push da Imagem Docker
    runs-on: self-hosted

    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/primeira-pipeline-cicd:v${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/primeira-pipeline-cicd:latest

  CD:
    name: Deploy no Kubernetes
    runs-on: self-hosted
    needs: [CI]

    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Atualizar imagem no manifesto Kubernetes
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/primeira-pipeline-cicd:v${{ github.run_number }}|g" k8s/deployment.yaml

      - name: Aplicar manifesto no Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Verificar rollout
        run: |
          kubectl rollout status deployment/web
          kubectl get pods
          kubectl get svc
